# Scheduled jobs (spec 13.2). GitHub cron is UTC; IST = UTC + 5:30.
#
# Two modes, picked by the repo variable CRON_MODE (Settings > Secrets and variables > Actions > Variables):
#   direct (default) - the job runs HERE on the GitHub runner, straight against Neon. Real logs, real pass/fail.
#                      Secrets: DATABASE_URL, LLM_API_KEY (+ optional VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT,
#                      TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, FRONTEND_ORIGIN for the link in Telegram messages).
#   render           - the old way: POST to the Render API, which runs the job in a background thread.
#                      Secrets: FINN_API (e.g. https://finn-api.onrender.com) and JOB_TOKEN.
# `snapshot` always goes to Render: it writes a file that Render's replay mode serves.
name: cron
on:
  schedule:
    - cron: "30 3-14 * * 1-5"   # ingest_filings hourly, 09:00-20:00 IST, weekdays
    - cron: "0 13 * * 1-5"      # eod_prices 18:30 IST
    - cron: "0 2 * * *"         # build_digest 07:30 IST
    - cron: "30 13 * * *"       # build_digest 19:00 IST
    - cron: "30 15 * * *"       # docs_refresh 21:00 IST
    - cron: "0 16 * * *"        # snapshot 21:30 IST
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: ingest_filings
        type: choice
        options: [ingest_filings, eod_prices, build_digest, tripwires, financials, docs_refresh, snapshot]
concurrency:
  group: finn-cron        # one job at a time, so two jobs never write the same rows together
  cancel-in-progress: false
jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pick job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "30 3-14 * * 1-5") job=ingest_filings ;;
            "0 13 * * 1-5")    job=eod_prices ;;
            "0 2 * * *"|"30 13 * * *") job=build_digest ;;
            "30 15 * * *")     job=docs_refresh ;;
            "0 16 * * *")      job=snapshot ;;
            *)                 job="${{ github.event.inputs.job }}" ;;
          esac
          mode="${{ vars.CRON_MODE || 'direct' }}"
          if [ "$job" = "snapshot" ]; then mode=render; fi
          echo "job=$job" >> $GITHUB_OUTPUT
          echo "mode=$mode" >> $GITHUB_OUTPUT
          echo "Running $job in $mode mode"

      # --- direct mode ---
      - if: steps.pick.outputs.mode == 'direct'
        uses: actions/checkout@v4
      - if: steps.pick.outputs.mode == 'direct'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.pick.outputs.mode == 'direct'
        name: Install
        working-directory: backend
        run: pip install -q -r requirements.txt
      - if: steps.pick.outputs.mode == 'direct'
        name: Run job
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: gemini
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:finn@example.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          TZ: Asia/Kolkata
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repo secret (Neon connection string)"; exit 1; fi
          python -m app.jobs.cli job ${{ steps.pick.outputs.job }}

      # --- render mode (and snapshot) ---
      - if: steps.pick.outputs.mode == 'render'
        name: Wake the API (free hosts sleep)
        run: curl -s --max-time 90 "${{ secrets.FINN_API }}/api/health" > /dev/null || true
      - if: steps.pick.outputs.mode == 'render'
        name: Run job on Render
        run: |
          curl -sf -X POST -H "Authorization: Bearer ${{ secrets.JOB_TOKEN }}" \
            "${{ secrets.FINN_API }}/api/jobs/${{ steps.pick.outputs.job }}"
